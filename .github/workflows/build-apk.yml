name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridSense-Android-v2.0
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            GridSense-Android-v2.0.apk
          name: "Smart Energy Converter ${{ github.ref_name }} - Production Release"
          body: |
            ## Smart Energy Converter (Release ${{ github.ref_name }})
            ### Production-Grade IoT Energy Management System & Native Android Kotlin App

            - **🌐 Live Railway Cloud Web App**: [https://web-production-29e8e.up.railway.app](https://web-production-29e8e.up.railway.app)
            - **📱 Native Android APK**: Download `GridSense-Android-v2.0.apk` below (defaults to live Railway cloud with 1-tap local fallback).

            #### Key Capabilities:
            - **True RMS Telemetry Engine**: Computes instantaneous active power ($P$), current ($I_{\text{RMS}}$), voltage ($V$), and power factor ($\cos\phi$).
            - **Native Android Kotlin App**: 4 functionally differentiated tabs, MPAndroidChart diurnal curves, sub-50ms haptic relay switches.
            - **Railway.com 1-Click Deployment**: Multi-stage Docker container with embedded SQLite WAL mode and Socket.IO.
            - **Research Datasets**: 1,440-minute diurnal 24h CSV/JSON load profile conforming to IEC 62053-21 standards.

            #### Android Installation:
            ```bash
            adb install -r GridSense-Android-v2.0.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
