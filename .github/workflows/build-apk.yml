name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Fresh Debug APK (v3.0.0)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Fresh APK
        run: |
          mkdir -p release_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release_apk/SmartEnergyConservation-v3.0.0.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergyConservation-v3.0.0-APK
          path: release_apk/SmartEnergyConservation-v3.0.0.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-${{ github.run_number }}
          name: "Smart Energy Conservation v3.0.0 (Build ${{ github.run_number }})"
          body: |
            ## Smart Energy Conservation v3.0.0 (Fresh Build ${{ github.run_number }})

            ### What's New
            - 🔐 **Supabase Auth** — Synced login across Web & Android
            - 🏢 **3D Live Space** — Immersive 3D room simulation
            - 🌑 **Full Dark UI** — Deep black theme `#0A0A0F` with modern blue accents
            - ⚡ **Hero Power Card** — 52sp live watt display
            - 🔄 **Profile Switcher** — Dedicated button in header to switch residents or sign out
            - 🖼️ **Custom App Icon** — Green leaf-lightning icon
          files: release_apk/SmartEnergyConservation-v3.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
