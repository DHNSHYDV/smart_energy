name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridSense-Android-v2.0
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            GridSense-Android-v2.0.apk
          name: "GridSense Enterprise EMS ${{ github.ref_name }} - Production Release"
          body: |
            ## GridSense Enterprise EMS (Release ${{ github.ref_name }})
            ### Production-Grade IoT Energy Management System & Android Mobile Application

            #### Key Capabilities:
            - **High-Fidelity Telemetry Engine**: True RMS electrical modeling, instantaneous active power, current, voltage, and power factor.
            - **Native Android Kotlin App**: Dual-curved card stack, 4 functionally differentiated tabs, MPAndroidChart diurnal curves, sub-50ms haptic relay switches.
            - **Demand-Side Management (DSM)**: 4 automated scenes, peak load shifting analytics, and dynamic load curtailment.
            - **Deduplicated Anomaly Detection**: IEC-standard fault recognition without notification spamming.

            #### Installation:
            ```bash
            adb install -r GridSense-Android-v2.0.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
