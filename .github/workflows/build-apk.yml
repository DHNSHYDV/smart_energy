name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Fresh Release APK (v4.0.0)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Fresh APK
        run: |
          mkdir -p release_apk
          cp android/app/build/outputs/apk/release/app-release.apk release_apk/SmartEnergyConservation-v4.0.0.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergyConservation-v4.0.0-APK
          path: release_apk/SmartEnergyConservation-v4.0.0.apk
          retention-days: 30

      - name: Create Official GitHub Release v4.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: "Smart Energy Conservation v4.0.0 (Official Signed Release)"
          body: |
            # ⚡ Smart Energy Conservation v4.0.0 — Official Signed Release

            An enterprise-grade, IoT-driven Smart Energy Management & Microgrid Digital Twin platform with deterministic APK signing, full 5-tab native Android capsule navigation, embedded WebGL 3D digital twin room, and real-time sub-metering telemetry.

            ---

            ## 🌟 Key Features in v4.0.0

            ### 📱 Signed Native Android Application
            - **🔑 Signed Release Certificate**: Signed with deterministic release keystore (`release.keystore`) for zero installation errors or package conflicts.
            - **⚡ 5-Tab Native Floating Capsule Dock**:
              1. 🏠 **Home**: Live active power draw gauge (W), voltage/PF metrics, top circuit switches, resident switcher (`Dhanush Yadav` / `Priya Sharma`).
              2. ⚡ **3D Room (Live Space)**: Full-frame Three.js 3D room canvas with real-time green wire glow effects in WebGL hardware acceleration.
              3. 📱 **Devices**: Native sub-metering circuit list with live active power (W), current (A), power factor (PF), and detailed bottom sheets.
              4. 📊 **Analytics**: MPAndroidChart 24-hour diurnal load forecast curve (00:00–23:00) & billing analysis.
              5. ⚙️ **Automations**: Scenario injection macros (Overload/Brownout) & 1-tap Server IP config dialog.
            - **⚡ 1-Tap Client Demo Mode**: Instant access with zero login required for client presentations.
            - **🛡️ Crash-Proof Offline Engine**: 100% stable local IoT simulation mode when offline.

            ---

            ## 📦 Download Assets

            | Asset Name | Description | Direct Download |
            | :--- | :--- | :--- |
            | **`SmartEnergyConservation-v4.0.0.apk`** | Signed Android Release (v4.0.0) | [Download v4.0.0 APK](https://github.com/DHNSHYDV/smart_energy/releases/download/v4.0.0/SmartEnergyConservation-v4.0.0.apk) |
          files: release_apk/SmartEnergyConservation-v4.0.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
