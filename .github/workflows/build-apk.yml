name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergyTracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Smart Energy Tracker v1.0.0 - Android APK"
          body: |
            ## Smart Energy Conservation Tracker – Environmental
            ### Android Mobile Application Release (v1.0.0)

            - **App Name**: Smart Energy Tracker
            - **Platform**: Android Native (Java + Gradle)
            - **Features**:
              - Real-time Socket.IO telemetry streaming
              - Remote appliance relay actuation (ON/OFF)
              - Virtual CT sensor monitoring
              - Anomaly detection & alerts
              - In-app IP configuration dialog

            ### Installation:
            1. Download `SmartEnergyTracker.apk` below to your Android device.
            2. Tap the APK to install.
            3. Open the app, tap **"IP Setup"**, and connect to your laptop simulation server!
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
