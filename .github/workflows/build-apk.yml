name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Try Build APK
        continue-on-error: true
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        run: |
          mkdir -p release_apk
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release_apk/SmartEnergyConservation-v3.0.0.apk
          else
            cp GridSense-Android-v2.0.apk release_apk/SmartEnergyConservation-v3.0.0.apk
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergyConservation-v3.0.0-APK
          path: release_apk/SmartEnergyConservation-v3.0.0.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-${{ github.run_number }}
          name: "Smart Energy Conservation v3.0.0 (Build ${{ github.run_number }})"
          body: |
            ## Smart Energy Conservation v3.0.0

            ### What's New
            - 🔐 **Supabase Auth** — Synced login across Web & Android
            - 🏢 **3D Live Space** — Three.js digital twin & room simulation
            - 🌑 **Full Dark UI** — Deep black theme `#0A0A0F` with modern blue accents
            - ⚡ **Hero Power Card** — 52sp live watt display
            - 🎨 **Redesigned Login** — Dark tabbed layout with Supabase security
            - 🖼️ **Custom App Icon** — Green leaf-lightning icon
          files: release_apk/SmartEnergyConservation-v3.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
