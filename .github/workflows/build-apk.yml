name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/SmartEnergyConservation-v3.0.0-debug.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergyConservation-APK
          path: artifacts/SmartEnergyConservation-v3.0.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-${{ github.run_number }}
          name: "Smart Energy Conservation v3.0.0 (Build ${{ github.run_number }})"
          body: |
            ## Smart Energy Conservation v3.0.0

            ### What's New
            - 🔐 **Supabase Auth** — Email/password login synced across web & Android
            - 🌑 **Full Dark Theme** — Premium deep black UI throughout the app
            - ⚡ **Hero Power Card** — Big live watt display with grid metrics
            - 🎨 **Redesigned Login Screen** — Polished Sign In / Register tabs
            - 🏠 **Redesigned Home** — Quick actions, live loads, energy insights
            - 📱 **Dark Device Cards** — Blue accent, clean toggle switches
            - 🧭 **Dark Navigation Dock** — Floating pill nav at the bottom
            - 🏷️ App renamed to **Smart Energy Conservation**

            ### Install
            Download the APK below → transfer to Android phone → install
            (Allow "Install from unknown sources" in Settings)

            ### Login
            Create an account on [the web app](https://web-production-29e8e.up.railway.app) first,
            then use the same email + password in the Android app.
          files: artifacts/SmartEnergyConservation-v3.0.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
