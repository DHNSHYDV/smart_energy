name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/SmartEnergyConservation-v3.0.0-debug.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartEnergyConservation-v3.0.0-APK
          path: artifacts/SmartEnergyConservation-v3.0.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-${{ github.run_number }}
          name: "Smart Energy Conservation v3.0.0 (Build ${{ github.run_number }})"
          body: |
            ## Smart Energy Conservation v3.0.0

            ### What's New
            - 🔐 **Supabase Auth** — Synced login across Web & Android
            - 🏢 **3D Live Space** — Three.js digital twin & room simulation
            - 🌑 **Full Dark UI** — Deep black theme `#0A0A0F` with modern blue accents
            - ⚡ **Hero Power Card** — 52sp live watt display
            - 🎨 **Redesigned Login** — Dark tabbed layout with Supabase security
            - 🖼️ **Custom App Icon** — Green leaf-lightning icon
          files: artifacts/SmartEnergyConservation-v3.0.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
